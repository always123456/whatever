version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: job_match
      POSTGRES_PASSWORD: job_match
      POSTGRES_DB: job_match
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      JM_DATABASE_URL: postgresql+psycopg://job_match:job_match@db:5432/job_match
      JM_SECRET_KEY: change-me-in-prod
    ports:
      - "8080:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
